<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Gradiente con el azul eléctrico brillante solicitado -->
    <linearGradient id="bahiaSpocketAzul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" /> <!-- Azul Eléctrico -->
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" /> <!-- Azul Intenso -->
    </linearGradient>
  </defs>
  
  <!-- Fondo (Bordes redondeados, Negro para máximo contraste) -->
  <rect width="1024" height="1024" rx="220" fill="#111111" />
  
  <!-- Cuerpo de la NAS (Hardware grande) -->
  <rect x="130" y="160" width="764" height="694" rx="70" fill="#2a2a2a" />
  
  <!-- Bahía Izquierda -->
  <rect x="200" y="230" width="290" height="554" rx="40" fill="#1c1c1c" />
  <!-- LED Rojo -->
  <circle cx="345" cy="710" r="25" fill="#e74c3c" /> 
  
  <!-- Bahía Derecha (Ahora en el Azul Eléctrico del círculo anterior) -->
  <rect x="534" y="230" width="290" height="554" rx="40" fill="url(#bahiaSpocketAzul)" />
  <!-- LED Blanco -->
  <circle cx="679" cy="710" r="25" fill="#ffffff" /> 
  
  <!-- Rejillas de ventilación superiores -->
  <rect x="200" y="190" width="624" height="20" rx="10" fill="#1c1c1c" />
</svg>
