<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo oscuro Fintech -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Contenedor de la App -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Etiqueta DEV: Más grande, a la izquierda y en Amarillo Vibrante -->
  <text x="60" y="90" 
        fill="#FBBF24" 
        font-family="'Roboto', system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="42" 
        text-anchor="start" 
        letter-spacing="2">DEV</text>

  <!-- Grupo del logo ampliado, simétrico y centrado -->
  <g transform="translate(15, 25)">
    
    <!-- TRAMO 1: Naranja Oscuro / Quemado (Inicio/Base) -->
    <path d="M 80 340 L 180 240" 
          fill="none" 
          stroke="#EA580C" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- TRAMO 2: Naranja Claro / Enérgico (Transición/Medio) -->
    <path d="M 180 240 L 260 290" 
          fill="none" 
          stroke="#F97316" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- TRAMO 3: Amarillo Oro Brillante (Subida Final hacia la punta) -->
    <path d="M 260 290 L 390 140" 
          fill="none" 
          stroke="#FBBF24" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- CABEZA DE LA FLECHA: Mismo amarillo oro para cerrar la gama -->
    <path d="M 320 140 L 390 140 L 390 210" 
          fill="none" 
          stroke="#FBBF24" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
