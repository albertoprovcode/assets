<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bahiaVerdeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo (Bordes redondeados, Gris muy oscuro) -->
  <rect width="1024" height="1024" rx="220" fill="#111111" />
  
  <!-- Cuerpo de la NAS (MUCHO MÁS GRANDE para ocupar espacio) -->
  <rect x="130" y="160" width="764" height="694" rx="70" fill="#2a2a2a" />
  
  <!-- Bahía Izquierda -->
  <rect x="200" y="230" width="290" height="554" rx="40" fill="#1c1c1c" />
  <circle cx="345" cy="710" r="25" fill="#2ecc71" /> <!-- LED Verde -->
  
  <!-- Bahía Derecha -->
  <rect x="534" y="230" width="290" height="554" rx="40" fill="url(#bahiaVerdeGrad)" />
  <circle cx="679" cy="710" r="25" fill="white" /> <!-- LED Blanco -->
  
  <!-- Rejillas de ventilación -->
  <rect x="200" y="190" width="624" height="20" rx="10" fill="#1c1c1c" />
</svg>
